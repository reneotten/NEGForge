[build-system]
requires = ["maturin>=1.9.4,<2.0"]
build-backend = "maturin"

[project]
name = "negforge"
version = "0.1.0"
description = "1D ballistic-MOSFET electrostatics + NEGF transport simulator (Rust engine, Python frontend)"
requires-python = ">=3.9,<3.15"
classifiers = [
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
]
readme = "README.md"
license = { text = "MIT" }
dependencies = ["numpy>=1.22"]

[project.optional-dependencies]
notebook = ["jupyter", "matplotlib", "ipywidgets"]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.maturin]
manifest-path = "crates/negforge-py/Cargo.toml"
python-source = "python"
module-name = "negforge._negforge"
features = ["pyo3/extension-module"]
